name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: test
        run: go vet ./... && go test ./...
      - name: build all platforms
        run: ./build.sh "${GITHUB_REF_NAME#v}"
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          tag="$GITHUB_REF_NAME"
          pre=""; case "$tag" in *-*) pre="--prerelease" ;; esac
          notes="$(awk -v v="${tag#v}" '
            $0 ~ "^## "v { on=1; next }
            /^## / { if (on) exit }
            on { print }' CHANGELOG.md)"
          [ -n "$notes" ] || notes="See CHANGELOG.md"
          gh release create "$tag" dist/vault-* dist/SHA256SUMS --title "vault $tag" --notes "$notes" $pre
